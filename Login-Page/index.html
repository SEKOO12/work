<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a16">
  <title>Sign in | Northstar</title>
  <style>
    :root { color-scheme: light; --green: #315b49; --ink: #17231d; --muted: #77817b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 30px; background: #f1f3ef; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .layout { width: min(100%, 1000px); min-height: 620px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border: 1px solid #e3e7e1; border-radius: 24px; background: white; box-shadow: 0 28px 80px #18221a1c; }
    .welcome { position: relative; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 42px; color: #f6f7f3; background: radial-gradient(ellipse at 15% 90%, #4c715a 0, transparent 48%), linear-gradient(145deg, #1d3529, #101a16 70%); }
    .welcome::after { position: absolute; right: -110px; bottom: 80px; width: 330px; height: 330px; border: 1px solid #ffffff1b; border-radius: 50%; box-shadow: 0 0 0 35px #ffffff08, 0 0 0 70px #ffffff06; content: ""; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
    .brand-mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; color: #173426; background: #c4dfc9; font-size: 1.25rem; }
    .welcome-copy { position: relative; z-index: 1; max-width: 370px; margin: auto 0; padding: 72px 0; }
    .eyebrow { margin: 0 0 17px; color: #c5d9ca; font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .welcome h1 { margin: 0; font-size: clamp(2.25rem, 4vw, 3.35rem); line-height: 1.08; letter-spacing: -.055em; }
    .welcome-copy > p:last-child { max-width: 330px; margin: 20px 0 0; color: #c0ccc3; font-size: .98rem; line-height: 1.7; }
    .welcome footer { position: relative; z-index: 1; color: #bdc9c0; font-size: .78rem; }
    .form-panel { display: flex; align-items: center; justify-content: center; padding: 56px clamp(28px, 6vw, 68px); }
    .form-content { width: 100%; max-width: 360px; }
    .form-content h2 { margin: 0 0 9px; font-size: 1.85rem; letter-spacing: -.045em; }
    .subtitle { margin: 0 0 34px; color: var(--muted); font-size: .93rem; line-height: 1.5; }
    .field { margin-bottom: 20px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    label { font-size: .84rem; font-weight: 650; }
    a { color: var(--green); font-size: .82rem; font-weight: 650; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .input-wrap { position: relative; }
    input[type="email"], input[type="password"], input[type="text"] { width: 100%; height: 49px; padding: 0 14px; border: 1px solid #dfe4de; border-radius: 9px; outline: none; background: #fff; color: var(--ink); font: inherit; font-size: .9rem; transition: border-color .15s, box-shadow .15s; }
    input::placeholder { color: #a5ada7; }
    input:focus { border-color: #62866e; box-shadow: 0 0 0 3px #315b4919; }
    .toggle-password { position: absolute; top: 50%; right: 12px; padding: 5px; transform: translateY(-50%); border: 0; background: transparent; color: #78837c; font: inherit; font-size: .76rem; font-weight: 650; cursor: pointer; }
    .options { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 24px; }
    .remember { display: flex; align-items: center; gap: 8px; color: #59645d; font-size: .82rem; cursor: pointer; }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: var(--green); }
    .submit { width: 100%; height: 49px; border: 0; border-radius: 9px; color: #fff; background: var(--green); font: inherit; font-size: .91rem; font-weight: 700; cursor: pointer; transition: background .15s, transform .15s; }
    .submit:hover { transform: translateY(-1px); background: #264a38; }
    .submit:focus-visible, .toggle-password:focus-visible, a:focus-visible { outline: 3px solid #78a18480; outline-offset: 3px; }
    .divider { display: flex; align-items: center; gap: 13px; margin: 25px 0; color: #9aa29c; font-size: .75rem; }
    .divider::before, .divider::after { height: 1px; flex: 1; background: #e9ece8; content: ""; }
    .google { display: flex; width: 100%; height: 46px; align-items: center; justify-content: center; gap: 10px; border: 1px solid #dfe4de; border-radius: 9px; color: #28332d; background: white; font: inherit; font-size: .85rem; font-weight: 650; cursor: pointer; }
    .google:hover { background: #f8faf7; }
    .google-mark { color: #4285f4; font-size: 1.05rem; font-weight: 800; }
    .signup { margin: 26px 0 0; color: var(--muted); font-size: .84rem; text-align: center; }
    .signup a { margin-left: 3px; }
    .message { min-height: 20px; margin: 14px 0 0; color: #a13f38; font-size: .8rem; text-align: center; }
    @media (max-width: 720px) { body { padding: 16px; } .layout { max-width: 470px; min-height: auto; grid-template-columns: 1fr; } .welcome { min-height: 210px; padding: 25px 28px; } .welcome-copy { padding: 28px 0 20px; } .welcome h1 { max-width: 300px; font-size: 2.05rem; } .welcome-copy > p:last-child { margin-top: 10px; font-size: .88rem; } .welcome footer { display: none; } .form-panel { padding: 36px 28px 32px; } .subtitle { margin-bottom: 26px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="layout">
    <section class="welcome" aria-label="Welcome">
      <div class="brand"><span class="brand-mark" aria-hidden="true">N</span> Northstar</div>
      <div class="welcome-copy">
        <p class="eyebrow">A clearer way forward</p>
        <h1>Good to see you again.</h1>
        <p>Sign in to pick up where you left off and keep everything moving.</p>
      </div>
      <footer>© 2026 Northstar. All rights reserved.</footer>
    </section>
    <section class="form-panel" aria-labelledby="login-title">
      <div class="form-content">
        <h2 id="login-title">Sign in</h2>
        <p class="subtitle">Enter your details below to access your account.</p>
        <form id="login-form">
          <div class="field">
            <div class="label-row"><label for="email">Email address</label></div>
            <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="field">
            <div class="label-row"><label for="password">Password</label><a href="#forgot-password">Forgot password?</a></div>
            <div class="input-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
          </div>
          <div class="options"><label class="remember"><input type="checkbox" name="remember"> Remember me</label></div>
          <button class="submit" type="submit">Sign in</button>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>
        <div class="divider">or continue with</div>
        <button class="google" type="button"><span class="google-mark" aria-hidden="true">G</span> Continue with Google</button>
        <p class="signup">New to Northstar? <a href="#create-account">Create an account</a></p>
      </div>
    </section>
  </main>
  <script>
    const password = document.querySelector('#password');
    const toggle = document.querySelector('.toggle-password');
    toggle.addEventListener('click', () => {
      const showing = password.type === 'password';
      password.type = showing ? 'text' : 'password';
      toggle.textContent = showing ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(showing));
    });
    document.querySelector('#login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#message').textContent = 'The page is ready. Connect an authentication service to sign in.';
    });
  </script>
</body>
</html>
